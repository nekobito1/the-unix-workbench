name: Manual Testing Pipeline Automator

on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]

jobs:
  move-card:
    runs-on: ubuntu-latest
    steps:
      - name: Move Card Based on Testing Label
        env:
          GH_TOKEN: ${{ secrets.PROJECT_AUTOMATION_TOKEN }}
          LABEL_NAME: ${{ github.event.label.name }}
          # Use your exact GitHub Project Number (found in your board's URL: ://github.com)
          PROJECT_NUMBER: 1 
          ORGANIZATION: "your-github-org-name" # Change to your GitHub username or Org name
          
          # Map your custom labels to the project board's column text exactly
          # Example: Label "status: passes-test" moves ticket to column "In QA"
        run: |
          # 1. Determine if this event is for an issue or PR and grab its URL
          if [ "${{ github.event_name }}" = "issues" ]; then
            ITEM_URL="${{ github.event.issue.html_url }}"
          else
            ITEM_URL="${{ github.event.pull_request.html_url }}"
          fi

          # 2. Map the label added by the tester to your pipeline column
          TARGET_COLUMN=""
          case "$LABEL_NAME" in
            "status: passes-test")
              TARGET_COLUMN="In QA"
              ;;
            "status: passes-qa")
              TARGET_COLUMN="In STAGING"
              ;;
            "status: passes-staging")
              TARGET_COLUMN="Move to LIVE"
              ;;
            "status: verified-live")
              TARGET_COLUMN="Closed"
              ;;
          esac

          # 3. If the label matches one of our testing stages, move the card using GitHub CLI
          if [ -not -z "$TARGET_COLUMN" ]; then
            echo "Moving item $ITEM_URL to column: $TARGET_COLUMN"
            gh project item-edit $PROJECT_NUMBER \
              --owner "$ORGANIZATION" \
              --url "$ITEM_URL" \
              --field "Status" \
              --value "$TARGET_COLUMN"
          else
            echo "Label '$LABEL_NAME' is not a testing pipeline trigger. Skipping."
          fi
